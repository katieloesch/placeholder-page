<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A developer portfolio is being rebuilt and will be back soon."
    />
    <title>Katie Loesch Portfolio Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="title">
        <figure class="hero-art">
          <img
            src="assets/under_construction.png"
            alt="Illustration of a website under construction"
          />
        </figure>
        <div>
          <p class="eyebrow">Portfolio rebuild in progress</p>
          <h1 id="title">New work is on its way.</h1>
          <p class="intro">
            I am reshaping this space. Back soon with fresh work.
          </p>
        </div>
      </section>

      <footer>
        <span>&copy; 2026 Katie Loesch</span>
        <span class="footer-note"></span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
