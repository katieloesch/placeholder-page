<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A new experience is under construction."
    />
    <title>Northstar | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">Northstar</div>
        <div class="status">
          <span class="dot"></span> Building something new
        </div>
      </header>

      <section class="hero" aria-labelledby="title">
        <div class="orbit" aria-hidden="true">
          <div class="orbit-line"></div>
          <div class="spark"></div>
        </div>
        <div>
          <p class="eyebrow">A brighter direction is taking shape</p>
          <h1 id="title">We are making room for what matters.</h1>
          <p class="intro">
            Northstar is being rebuilt with more clarity, more care, and a
            little more joy. We will be back shortly.
          </p>
          <form class="signup" id="signup-form">
            <label for="email">Get launch notes</label>
            <div class="form-row">
              <input
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
              <button type="submit">Notify me</button>
            </div>
            <p class="message" id="form-message" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <footer>
        <span>&copy; 2026 Northstar</span>
        <span class="footer-note">Good things take shape</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
